<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Коллекция Каёко</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7ff;
            color: #31566d;
        }

        header {
            text-align: center;
            padding: 35px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .back {
            display: inline-block;
            padding: 10px 18px;
            background: white;
            border-radius: 15px;
            text-decoration: none;
            color: #31566d;
            margin-bottom: 20px;
        }

        .counter {
            font-size: 18px;
        }

        .open-button {
            display: block;
            margin: 10px auto 35px;
            padding: 15px 25px;
            border: none;
            border-radius: 18px;
            background: #cce8ff;
            color: #31566d;
            font-size: 17px;
            cursor: pointer;
        }

        .open-button:hover {
            background: #b5ddff;
        }

        .current {
            max-width: 500px;
            margin: 0 auto 35px;
            padding: 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(50, 120, 160, 0.15);
            text-align: center;
        }

        .current img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 20px;
        }

        .hidden {
            display: none !important;
        }

        .collection {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(150px, 1fr)
            );
            gap: 18px;
        }

        .card {
            background: white;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 7px 20px rgba(50, 120, 160, 0.12);
            min-width: 0;
        }

        .card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 15px;
        }

        .card:not(.locked) {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:not(.locked):hover {
            transform: translateY(-4px);
        }

        .locked {
            background: #d5d5d5;
            color: #777;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lock {
            font-size: 45px;
        }

        .secret {
            border: 3px solid #b98cff;
        }

        .reset {
            display: block;
            margin: 30px auto 50px;
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            color: #31566d;
        }

        /* Затемнение фона при просмотре карточки */

        .card-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 35, 50, 0.72);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-modal {
            position: relative;
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 25px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card-modal img {
            display: block;
            width: 100%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 18px;
        }

        .close-card {
            position: sticky;
            float: right;
            top: 0;
            margin: -10px -10px 0 0;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #eef7ff;
            color: #31566d;
            font-size: 25px;
            cursor: pointer;
            z-index: 2;
        }

        .modal-text {
            clear: both;
            padding-top: 5px;
        }

        @media (max-width: 400px) {
            .collection {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                padding: 12px;
            }

            .card {
                padding: 8px;
            }

            .card-modal {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="back">
            ← На главную страницу 
        </a>

        <h1>💙 Коллекция Каёко💙</h1>

        <p class="counter" id="counter">
            Открыто: 0 / 10
        </p>
    </header>

    <button class="open-button" id="openButton">
        🎁 Открыть фотографию
    </button>

    <div id="current" class="current hidden">
        <img id="currentImage" src="" alt="Каёко">

        <h2 id="currentTitle"></h2>
        <p id="currentRarity"></p>
        <p id="currentDescription"></p>
    </div>

    <h2 style="text-align:center;">
        Моя коллекция
    </h2>

    <div class="collection" id="collection"></div>

    <!-- Окно увеличенной карточки -->

    <div class="card-overlay" id="cardOverlay">

        <div class="card-modal">

            <button
                class="close-card"
                id="closeCard"
                aria-label="Закрыть карточку"
            >
                ✕
            </button>

            <div class="modal-text">
                <img id="modalImage" src="" alt="Каёко">

                <h2 id="modalTitle"></h2>
                <p id="modalRarity"></p>
                <p id="modalDescription"></p>
            </div>

        </div>

    </div>

    <button class="reset" id="resetButton">
        Сбросить коллекцию
    </button>

    <script>
        const photos = [
            {
                id: "cafe",
                title: "Каёко в кафе",
                rarity: "⚪ Обычная",
                rarityKey: "common",
                description: "Каёко сидит у окна любимого кафе.",
                image: "kayoko-cafe.jpg"
            },
            {
                id: "class",
                title: "Каёко в классе",
                rarity: "⚪ Обычная",
                rarityKey: "common",
                description: "Обычный день в академии Мидзухана.",
                image: "kayoko-class.jpg"
            },
            {
                id: "music",
                title: "Каёко и музыка",
                rarity: "⚪ Обычная",
                rarityKey: "common",
                description: "Любимая музыка и немного отдыха.",
                image: "kayoko-music.jpg"
            },
            {
                id: "tokyo",
                title: "Прогулка по Токио",
                rarity: "🟣 Эпическая",
                rarityKey: "epic",
                description: "Вечерняя прогулка по улицам Токио.",
                image: "kayoko-tokyo.jpg"
            },
            {
                id: "sunset",
                title: "Каёко на закате",
                rarity: "🟣 Эпическая",
                rarityKey: "epic",
                description: "Красивый вечерний закат.",
                image: "kayoko-sunset.jpg"
            },
            {
                id: "sea",
                title: "Каёко на море",
                rarity: "🟣 Эпическая",
                rarityKey: "epic",
                description: "День у моря.",
                image: "kayoko-sea.jpg"
            },
            {
                id: "window",
                title: "Каёко у окна",
                rarity: "🔵 Редкая",
                rarityKey: "rare",
                description: "Тихий вечер дома.",
                image: "kayoko-window.jpg"
            },
            {
                id: "rain",
                title: "Каёко под дождём",
                rarity: "🔵 Редкая",
                rarityKey: "rare",
                description: "Небольшая прогулка под дождём.",
                image: "kayoko-rain.jpg"
            },
            {
                id: "night",
                title: "Каёко ночью",
                rarity: "🟡 Легендарная",
                rarityKey: "legendary",
                description: "Тихий Токио поздним вечером.",
                image: "kayoko-night.jpg"
            },
            {
                id: "secret",
                title: "Секретная фотография",
                rarity: "🌈 Секретная",
                rarityKey: "secret",
                description: "Каёко нашла маленького котёнка и осторожно его погладила. 🐱",
                image: "kayoko-secret.jpg"
            }
        ];

        /*
          Шансы по редкости:
          Обычная — 50%
          Редкая — 30%
          Эпическая — 15%
          Легендарная — 4%
          Секретная — 0.7%

          Сумма весов — 99.7.
          Это приблизительные шансы за одно открытие.
        */

        const rarityWeights = {
            common: 50,
            rare: 30,
            epic: 15,
            legendary: 4,
            secret: 0.7
        };

        const collection = document.getElementById("collection");
        const counter = document.getElementById("counter");
        const current = document.getElementById("current");

        const overlay = document.getElementById("cardOverlay");
        const modalImage = document.getElementById("modalImage");
        const modalTitle = document.getElementById("modalTitle");
        const modalRarity = document.getElementById("modalRarity");
        const modalDescription = document.getElementById("modalDescription");

        function loadOpened() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem("kayokoCollection") || "[]"
                );

                if (!Array.isArray(saved)) {
                    return [];
                }

                return saved.filter(id =>
                    photos.some(photo => photo.id === id)
                );
            } catch (error) {
                return [];
            }
        }

        let opened = loadOpened();
        let lastPhotoId = null;

        function save() {
            try {
                localStorage.setItem(
                    "kayokoCollection",
                    JSON.stringify(opened)
                );
            } catch (error) {
                console.warn("Не удалось сохранить коллекцию.", error);
            }
        }

        function render() {
            collection.innerHTML = "";

            photos.forEach(photo => {
                const card = document.createElement("div");
                card.className = "card";

                if (opened.includes(photo.id)) {
                    card.innerHTML = `
                        <img src="${photo.image}" alt="${photo.title}">
                        <h3>${photo.title}</h3>
                        <p>${photo.rarity}</p>
                    `;

                    if (photo.id === "secret") {
                        card.classList.add("secret");
                    }

                    card.addEventListener("click", () => {
                        openCard(photo);
                    });
                } else {
                    card.classList.add("locked");

                    card.innerHTML = `
                        <div class="lock">🔒</div>
                        <h3>???</h3>
                        <p>Не открыто</p>
                    `;
                }

                collection.appendChild(card);
            });

            counter.textContent =
                "Открыто: " + opened.length + " / " + photos.length;
        }

        function choosePhoto() {
            const availablePhotos = photos.filter(
                photo => photo.id !== lastPhotoId
            );

            if (availablePhotos.length === 0) {
                return null;
            }

            /*
              Делим вес каждой редкости между фотографиями
              этой редкости, чтобы редкость определяла шанс.
            */

            const rarityCounts = {};

            availablePhotos.forEach(photo => {
                rarityCounts[photo.rarityKey] =
                    (rarityCounts[photo.rarityKey] || 0) + 1;
            });

            const weightedPhotos = availablePhotos.map(photo => ({
                photo,
                weight:
                    rarityWeights[photo.rarityKey] /
                    rarityCounts[photo.rarityKey]
            }));

            const totalWeight = weightedPhotos.reduce(
                (sum, item) => sum + item.weight,
                0
            );

            let random = Math.random() * totalWeight;

            for (const item of weightedPhotos) {
                random -= item.weight;

                if (random < 0) {
                    return item.photo;
                }
            }

            return weightedPhotos[weightedPhotos.length - 1].photo;
        }

        function showPhoto(photo) {
            current.classList.remove("hidden");

            document.getElementById("currentImage").src = photo.image;
            document.getElementById("currentTitle").textContent = photo.title;
            document.getElementById("currentRarity").textContent = photo.rarity;
            document.getElementById("currentDescription").textContent =
                photo.description;

            /*
              Повторная карточка показывается снова,
              но счётчик коллекции увеличивается только впервые.
            */

            if (!opened.includes(photo.id)) {
                opened.push(photo.id);
                save();
                render();
            }
        }

        function openCard(photo) {
            modalImage.src = photo.image;
            modalTitle.textContent = photo.title;
            modalRarity.textContent = photo.rarity;
            modalDescription.textContent = photo.description;

            overlay.style.display = "flex";
        }

        function closeCard() {
            overlay.style.display = "none";
        }

        document.getElementById("openButton").addEventListener(
            "click",
            () => {
                const photo = choosePhoto();

                if (!photo) {
                    return;
                }

                lastPhotoId = photo.id;
                showPhoto(photo);
            }
        );

        document.getElementById("closeCard").addEventListener(
            "click",
            closeCard
        );

        overlay.addEventListener("click", event => {
            if (event.target === overlay) {
                closeCard();
            }
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeCard();
            }
        });

        document.getElementById("resetButton").addEventListener(
            "click",
            () => {
                if (confirm("Сбросить всю коллекцию?")) {
                    opened = [];
                    lastPhotoId = null;
                    save();

                    current.classList.add("hidden");
                    closeCard();
                    render();
                }
            }
        );

        render();
    </script>

</body>
</html>
