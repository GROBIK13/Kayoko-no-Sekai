<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Судзуко Каёко — Tokyo 3D</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="loading">🌸 Загружаем Токио…</div>

  <div id="hud">
    <div class="panel">
      <b>🌸 Судзуко Каёко</b>
      <span>3D Tokyo</span>
    </div>
    <div class="panel stats">
      ⭐ <span id="score">0</span>
      🐈 <span id="cats">0</span>
      📸 <span id="photos">0</span>
      💰 <span id="coins">0</span>
    </div>
  </div>

  <div id="message"></div>

  <div id="help">
    <b>Управление</b><br>
    WASD / стрелки — ходьба<br>
    E — взаимодействие
  </div>

  <button id="newWalk">↻ Новая прогулка</button>

  <div id="mobileControls">
    <button data-key="ArrowUp">▲</button>
    <div>
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowDown">▼</button>
      <button data-key="ArrowRight">▶</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
