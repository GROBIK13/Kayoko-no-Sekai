<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Судзуко Каёко — Tokyo 3D</title>

  <link rel="stylesheet" href="game.css">
</head>

<body>

  <!-- Загрузка -->
  <div id="loading">
    🌸 Загружаем Токио…
  </div>


  <!-- HUD -->
  <div id="hud">

    <div class="panel">
      <b>🌸 Судзуко Каёко</b>
      <span>3D Tokyo</span>
    </div>

    <div class="panel stats">

      ⭐ <span id="score">0</span>

      🐈 <span id="cats">0</span>

      📸 <span id="photos">0</span>

      💰 <span id="coins">0</span>

    </div>

  </div>


  <!-- Сообщения -->
  <div id="message"></div>


  <!-- Подсказка -->
  <div id="help">

    <b>Управление</b><br>

    WASD / стрелки — ходьба<br>

    E — взаимодействие

  </div>


  <!-- Новая прогулка -->
  <button id="newWalk">
    ↻ Новая прогулка
  </button>


  <!-- Мобильное управление -->
  <div id="mobileControls">

    <button data-key="ArrowUp">
      ▲
    </button>

    <div>

      <button data-key="ArrowLeft">
        ◀
      </button>

      <button data-key="ArrowDown">
        ▼
      </button>

      <button data-key="ArrowRight">
        ▶
      </button>

    </div>

  </div>


  <!--
    Three.js загружается ЛОКАЛЬНО.
    Файл должен находиться:
    js/three.min.js
  -->

  <script src="js/three.min.js"></script>

  <!-- Основной код игры -->
  <script src="game.js"></script>

</body>

</html>
